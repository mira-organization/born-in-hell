name: Pre-Release

permissions:
  contents: write
  pull-requests: read

on:
  pull_request:
    types: [closed]
    branches: [staging]

env:
  binary: born-in-hell
  add_binaries_to_github_release: true
  use_git_lfs: false

jobs:
  compute-and-tag:
    name: Compute next pre-release tag

    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'develop' }}
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.version.outputs.TAG_NAME }}
    steps:
      - name: Checkout (full history incl. tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: ${{ env.use_git_lfs == 'true' }}

      - name: Fetch tags
        run: |
          git fetch --tags --force

      - name: Determine next version from PR title
        id: version
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          # Finde letzten rc-Tag (z. B. v0.1.2-rc)
          last_tag="$(git tag -l 'v*-rc' --sort=-v:refname | head -n1 || true)"

          if [[ -z "$last_tag" ]]; then
            # Kein vorheriger rc-Tag → Startwert
            major=0; minor=1; patch=0
          else
            if [[ "$last_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)-rc$ ]]; then
              major="${BASH_REMATCH[1]}"
              minor="${BASH_REMATCH[2]}"
              patch="${BASH_REMATCH[3]}"
            else
              echo "Letzter Tag hat unerwartetes Format: $last_tag"
              exit 1
            fi
          fi

          title="$PR_TITLE"
          shopt -s nocasematch
          if [[ "$title" =~ ^feat ]]; then
            patch=$((patch+1))
          elif [[ "$title" =~ ^base ]]; then
            minor=$((minor+1))
            patch=0
          else
            # Fallback: Patch bump (falls du strikt sein willst -> exit 1)
            patch=$((patch+1))
          fi
          shopt -u nocasematch

          new_tag="v${major}.${minor}.${patch}-rc"
          echo "TAG_NAME=$new_tag" >> "$GITHUB_OUTPUT"
          echo "Neuer Tag: $new_tag (PR-Titel: $title)"

      - name: Create and push tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.TAG_NAME }}" -m "Pre-release: ${{ steps.version.outputs.TAG_NAME }} (from PR #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }})"
          git push origin "${{ steps.version.outputs.TAG_NAME }}"

  release-linux:
    needs: compute-and-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: ${{ env.use_git_lfs == 'true' }}

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-08-07
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-gnu

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libx11-dev libasound2-dev libudev-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev zip

      - name: Set Cargo Target Directory
        run: echo "CARGO_TARGET_DIR=target" >> $GITHUB_ENV

      - name: Build
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Prepare package
        run: |
          mkdir linux
          cp target/x86_64-unknown-linux-gnu/release/${{ env.binary }} linux/
          cp -r assets linux/ || true
          cp -r config linux/ || true

      - name: Package as a zip
        working-directory: ./linux
        run: zip --recurse-paths ../${{ env.binary }}.zip .

      - name: Upload binaries to artifacts
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.binary }}.zip
          name: linux
          retention-days: 1

      - name: Upload binaries to pre-release
        if: ${{ env.add_binaries_to_github_release == 'true' }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.binary }}.zip
          asset_name: ${{ env.binary }}-linux-${{ needs.compute-and-tag.outputs.tag_name }}.zip
          tag: ${{ needs.compute-and-tag.outputs.tag_name }}
          overwrite: true
          prerelease: true
          draft: false
          make_latest: false
          release_name: "${{ env.binary }} ${{ needs.compute-and-tag.outputs.tag_name }}"

  release-windows:
    needs: compute-and-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: ${{ env.use_git_lfs == 'true' }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-08-07
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Prepare package
        shell: pwsh
        run: |
          mkdir windows
          Copy-Item target/x86_64-pc-windows-msvc/release/${{ env.binary }}.exe windows/
          if (Test-Path assets) { Copy-Item assets windows -Recurse }
          if (Test-Path config) { Copy-Item config windows -Recurse }

      - name: Package as a zip
        shell: pwsh
        run: Compress-Archive -Path windows/* -DestinationPath ${{ env.binary }}.zip

      - name: Upload binaries to artifacts
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.binary }}.zip
          name: windows
          retention-days: 1

      - name: Upload binaries to pre-release
        if: ${{ env.add_binaries_to_github_release == 'true' }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.binary }}.zip
          asset_name: ${{ env.binary }}-windows-${{ needs.compute-and-tag.outputs.tag_name }}.zip
          tag: ${{ needs.compute-and-tag.outputs.tag_name }}
          overwrite: true
          prerelease: true
          draft: false
          make_latest: false

  release-macOS-intel:
    needs: compute-and-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: ${{ env.use_git_lfs == 'true' }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-08-07
          components: clippy, rustfmt
          targets: x86_64-apple-darwin

      - name: Build
        env:
          CFLAGS: -fno-stack-check
          MACOSX_DEPLOYMENT_TARGET: "10.9"
        run: cargo build --release --target x86_64-apple-darwin

      - name: Prepare Package
        run: |
          mkdir -p ${{ env.binary }}.app/Contents/MacOS
          cp target/x86_64-apple-darwin/release/${{ env.binary }} ${{ env.binary }}.app/Contents/MacOS/
          cp -r assets ${{ env.binary }}.app/Contents/MacOS/ || true
          cp -r config ${{ env.binary }}.app/Contents/MacOS/ || true
          hdiutil create -fs HFS+ -volname "${{ env.binary }}" -srcfolder ${{ env.binary }}.app ${{ env.binary }}-macOS-intel.dmg

      - name: Upload binaries to artifacts
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.binary }}-macOS-intel.dmg
          name: macOS-intel
          retention-days: 1

      - name: Upload binaries to pre-release
        if: ${{ env.add_binaries_to_github_release == 'true' }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.binary }}-macOS-intel.dmg
          asset_name: ${{ env.binary }}-macOS-intel-${{ needs.compute-and-tag.outputs.tag_name }}.dmg
          tag: ${{ needs.compute-and-tag.outputs.tag_name }}
          overwrite: true
          prerelease: true
          draft: false
          make_latest: false

  release-macOS-apple-silicon:
    needs: compute-and-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: ${{ env.use_git_lfs == 'true' }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-08-07
          components: clippy, rustfmt
          targets: aarch64-apple-darwin

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: "11"
        run: cargo build --release --target aarch64-apple-darwin

      - name: Prepare Package
        run: |
          mkdir -p ${{ env.binary }}.app/Contents/MacOS
          cp target/aarch64-apple-darwin/release/${{ env.binary }} ${{ env.binary }}.app/Contents/MacOS/
          cp -r assets ${{ env.binary }}.app/Contents/MacOS/ || true
          cp -r config ${{ env.binary }}.app/Contents/MacOS/ || true
          hdiutil create -fs HFS+ -volname "${{ env.binary }}-macOS-apple-silicon" -srcfolder ${{ env.binary }}.app ${{ env.binary }}-macOS-apple-silicon.dmg

      - name: Upload binaries to artifacts
        uses: actions/upload-artifact@v4
        with:
          path: ${{ env.binary }}-macOS-apple-silicon.dmg
          name: macOS-apple-silicon
          retention-days: 1

      - name: Upload binaries to pre-release
        if: ${{ env.add_binaries_to_github_release == 'true' }}
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.binary }}-macOS-apple-silicon.dmg
          asset_name: ${{ env.binary }}-macOS-apple-silicon-${{ needs.compute-and-tag.outputs.tag_name }}.dmg
          tag: ${{ needs.compute-and-tag.outputs.tag_name }}
          overwrite: true
          prerelease: true
          draft: false
          make_latest: false
